---
# Download the node_exporter release and lay it out under a versioned path.

- name: Ensure base installation directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure versioned installation directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_version_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the archive download directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The checksum is verified by get_url before the archive is unpacked. An
# explicit digest wins; otherwise the sha256sums.txt published with the release
# is used, and get_url looks the entry up by the basename of the download URL.
# Verifying also makes this task idempotent: a matching archive is not
# re-downloaded on every run.
#
# Retried with backoff: a release download is exactly the kind of one-shot
# network call that fails transiently (DNS hiccup, GitHub throttling, a
# mirror momentarily unreachable) and there is nothing to roll back, so
# treating a single failure as fatal wastes the rest of an otherwise-healthy
# run. get_url's own `timeout` only bounds a single attempt, not the request
# as a whole.
- name: Download node_exporter release archive
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "{{ node_exporter_download_dir }}/{{ node_exporter_archive }}"
    checksum: >-
      {{ node_exporter_archive_checksum
         if node_exporter_archive_checksum | length > 0
         else ('sha256:' + node_exporter_checksum_url
               if node_exporter_checksum_url | length > 0
               else omit) }}
    owner: root
    group: root
    mode: "0644"
    timeout: "{{ node_exporter_download_timeout }}"
  register: _node_exporter_download
  until: _node_exporter_download is succeeded
  retries: "{{ node_exporter_download_retries }}"
  delay: "{{ node_exporter_download_retry_delay }}"

- name: Unarchive node_exporter into the versioned directory
  ansible.builtin.unarchive:
    src: "{{ node_exporter_download_dir }}/{{ node_exporter_archive }}"
    dest: "{{ node_exporter_version_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: root
    group: root
    creates: "{{ node_exporter_version_dir }}/node_exporter"

- name: Ensure textfile collector directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_directory }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: "0755"
  when: "'textfile' in node_exporter_enabled_collectors"

- name: Link current release to the installed version
  ansible.builtin.file:
    src: "{{ node_exporter_version_dir }}"
    dest: "{{ node_exporter_install_dir }}/current"
    state: link
  notify: Restart node_exporter
