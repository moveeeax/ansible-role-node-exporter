---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint, syntax-check and template tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ansible-lint needs a reasonably current ansible-core; the previous
      # "ansible>=2.9,<2.11" pin could no longer resolve alongside it.
      - name: Install dependencies
        run: pip install "ansible-core>=2.16" ansible-lint yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run syntax-check
        run: ansible-playbook --syntax-check -i tests/inventory tests/test.yml

      # Renders the systemd unit template across several variable combinations
      # and asserts on the result. Needs no container, so it gives fast
      # feedback ahead of the molecule job.
      - name: Run systemd unit template tests
        run: ansible-playbook -i tests/inventory tests/render.yml

      # Exercises the preflight assertions, including the collector-overlap
      # check, the same way the template tests above exercise the unit.
      - name: Run preflight assertion tests
        run: ansible-playbook -i tests/inventory tests/preflight.yml
