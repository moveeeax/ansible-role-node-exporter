---
name: Molecule

"on":
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  molecule:
    name: "Molecule: ${{ matrix.scenario }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - no-textfile
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The old "molecule[docker]" extra was removed in molecule 5; the driver
      # now ships in molecule-plugins. The previous ansible pin could not
      # resolve against a current molecule either.
      - name: Install dependencies
        run: |
          pip install "ansible-core>=2.16" molecule "molecule-plugins[docker]"
          ansible-galaxy collection install community.docker ansible.posix

      - name: Run molecule test
        run: molecule test -s "${{ matrix.scenario }}"
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
